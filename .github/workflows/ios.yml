name: build-unsigned-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          unzip -q -o ios-src.zip -d src
          ls -la src

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: src
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild -project LumiWords.xcodeproj -scheme LumiWords -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/LumiWords.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Package ipa
        working-directory: src
        run: |
          mkdir -p out/Payload
          cp -R build/LumiWords.xcarchive/Products/Applications/LumiWords.app out/Payload/
          cd out && zip -qry LumiWords.ipa Payload && ls -la LumiWords.ipa

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-ios-build
          path: |
            src/build.log
            src/out/LumiWords.ipa
          if-no-files-found: warn
